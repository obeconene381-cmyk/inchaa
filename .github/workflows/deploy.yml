name: Auto VLESS Deploy (with Cloudflare)

on:
  workflow_dispatch:
    inputs:
      lab_url:
        description: 'Qwiklabs URL'
        required: true
        type: string
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ⏱️ إيقاف إجباري بعد 15 دقيقة

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Playwright Script
        env:
          # المتغيرات القديمة تاعك
          LAB_URL: ${{ github.event.inputs.lab_url }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          LOG_BOT_TOKEN: ${{ secrets.LOG_BOT_TOKEN }}
          
          # 🆕 المتغيرات الجديدة تاع كلودفلير (زدناهم هنا)
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

        run: python main.py
