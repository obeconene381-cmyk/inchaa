name: Run Lab Automation

on:
  workflow_dispatch:
    inputs:
      lab_url:
        description: 'Lab Catalog URL'
        required: true
        type: string
      cookies_b64:
        description: 'Cookies in Base64 format'
        required: true
        type: string
      bot_token:
        description: 'Telegram Bot Token'
        required: true
        type: string
      chat_id:
        description: 'Telegram User Chat ID'
        required: true
        type: string
      admin_id:
        description: 'Telegram Admin Chat ID'
        required: false
        default: ''
        type: string
      region_override:
        description: 'Region Override (optional)'
        required: false
        default: ''
        type: string
      proxy_url:
        description: 'VLESS, Trojan, SOCKS5 or HTTP Proxy Link (optional)'
        required: false
        default: ''
        type: string

jobs:
  execute-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies, Xvfb & Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev unzip curl wget

      - name: Install Google Chrome (real, not Chromium)
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
          google-chrome --version

      - name: Install Python Libraries & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install-deps chromium

      - name: Run Playwright Automation with Proxy Engine
        env:
          LAB_URL: ${{ github.event.inputs.lab_url }}
          COOKIES_B64: ${{ github.event.inputs.cookies_b64 }}
          BOT_TOKEN: ${{ github.event.inputs.bot_token }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          ADMIN_ID: ${{ github.event.inputs.admin_id || secrets.ADMIN_ID }}
          REGION_OVERRIDE: ${{ github.event.inputs.region_override }}
          PROXY_URL: ${{ github.event.inputs.proxy_url || secrets.PROXY_URL }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python tmtmo3.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: |
            *.png
          retention-days: 3
          if-no-files-found: ignore
