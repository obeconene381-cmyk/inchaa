name: Run Playwright Bot on Windows

on:
  workflow_dispatch: # هذا السطر يسمح لك بتشغيل السكريبت يدوياً متى شئت

jobs:
  run-script:
    runs-on: windows-latest # ⬅️ هنا طلبنا جهاز ويندوز من جيتهاب
    timeout-minutes: 360 # ⬅️ تحديد وقت التشغيل الأقصى بـ 6 ساعات كما طلبت

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      # تثبيت المكاتب مباشرة في سطر الأوامر (لا حاجة لملف requirements.txt)
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        playwright install chromium

    - name: Run Bot Script
      # تشغيل السكريبت الخاص بك
      run: python main.py
