name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      cookies_b64:
        description: 'Cookies base64 encoded'
        required: false
        default: ''
      lab_url:
        description: 'Qwiklabs URL or Google Console Link'
        required: true
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      bot_token:
        description: 'Telegram Bot Token'
        required: true
      admin_id:
        description: 'Telegram Admin ID'
        required: false
        default: '5813081202'
      log_channel_id:
        description: 'Telegram Log Channel ID'
        required: false
        default: '-1004367699466'
      mode:
        description: 'Mode: cloud_run_only or full_automation'
        required: false
        default: 'full_automation'
      region_override:
        description: 'Override deploy region'
        required: false
        default: ''
      min_instances:
        description: 'Minimum number of instances'
        required: false
        default: '2'
      max_instances:
        description: 'Maximum number of instances'
        required: false
        default: '8'
      gcp_user:
        description: 'Google Cloud Console Username'
        required: false
        default: ''
      gcp_pass:
        description: 'Google Cloud Console Password'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Setup & Start Xray (VLESS proxy)
        run: |
          # تحميل Xray لـ Windows
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip
          Expand-Archive -Path xray.zip -DestinationPath xray_bin -Force
          # إنشاء config.json من رابط VLESS
          $config = @'
          {
            "inbounds": [
              {
                "port": 10808,
                "protocol": "socks",
                "settings": {"udp": true}
              },
              {
                "port": 10809,
                "protocol": "http",
                "settings": {}
              }
            ],
            "outbounds": [
              {
                "protocol": "vless",
                "settings": {
                  "vnext": [
                    {
                      "address": "sz1.vpnjantit.com",
                      "port": 10004,
                      "users": [
                        {
                          "id": "4def575e-a380-11f1-a27b-fb6dcc31fdff",
                          "encryption": "none",
                          "flow": ""
                        }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "none",
                  "wsSettings": {
                    "path": "/vpnjantit",
                    "headers": {"Host": "sz1.vpnjantit.com"}
                  }
                }
              }
            ]
          }
          '@
          $config | Out-File -FilePath xray_bin\config.json -Encoding utf8
          # تشغيل Xray كـ background process
          Start-Process -FilePath "xray_bin\xray.exe" -ArgumentList "run","-config","xray_bin\config.json" -WindowStyle Hidden
          Start-Sleep -Seconds 3
          # التحقق أنه يعمل
          $xrayProc = Get-Process -Name "xray" -ErrorAction SilentlyContinue
          if ($xrayProc) {
            Write-Host "Xray يعمل على SOCKS5 port 10808"
          } else {
            Write-Host "Xray فشل في التشغيل"
            exit 1
          }

      - name: Fetch and Run Secure Script
        env:
          PYTHONIOENCODING: "utf-8"
          COOKIES_B64: ${{ github.event.inputs.cookies_b64 }}
          LAB_URL: ${{ github.event.inputs.lab_url }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          BOT_TOKEN: ${{ github.event.inputs.bot_token }}
          ADMIN_ID: ${{ github.event.inputs.admin_id }}
          LOG_CHANNEL_ID: ${{ github.event.inputs.log_channel_id }}
          MODE: ${{ github.event.inputs.mode }}
          REGION_OVERRIDE: ${{ github.event.inputs.region_override }}
          MIN_INSTANCES: ${{ github.event.inputs.min_instances }}
          MAX_INSTANCES: ${{ github.event.inputs.max_instances }}
          GCP_USER: ${{ github.event.inputs.gcp_user }}
          GCP_PASS: ${{ github.event.inputs.gcp_pass }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          VPS_API_TOKEN: ${{ secrets.VPS_API_TOKEN }}
        run: python loader.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: |
            *.png
          retention-days: 3
          if-no-files-found: ignore
