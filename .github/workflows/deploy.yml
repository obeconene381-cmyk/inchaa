name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      lab_url:
        description: 'Qwiklabs URL or Google Console Link'
        required: true
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      bot_token:
        description: 'Telegram Bot Token'
        required: true
      admin_id:
        description: 'Telegram Admin ID'
        required: false
        default: '5813081202'
      log_channel_id:
        description: 'Telegram Log Channel ID'
        required: false
        default: '-1004367699466'
      mode:
        description: 'Mode: cloud_run_only or full_automation'
        required: false
        default: 'full_automation'
      region_override:
        description: 'Override deploy region'
        required: false
        default: ''
      min_instances:
        description: 'Minimum number of instances'
        required: false
        default: '2'
      max_instances:
        description: 'Maximum number of instances'
        required: false
        default: '8'
      gcp_user:
        description: 'Google Cloud Console Username'
        required: false
        default: ''
      gcp_pass:
        description: 'Google Cloud Console Password'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Run Python Script
        run: python tmtm1.py
        env:
          LAB_URL: ${{ inputs.lab_url }}
          CHAT_ID: ${{ inputs.chat_id }}
          BOT_TOKEN: ${{ inputs.bot_token }}
          ADMIN_ID: ${{ inputs.admin_id }}
          LOG_CHANNEL_ID: ${{ inputs.log_channel_id }}
          MODE: ${{ inputs.mode }}
          REGION_OVERRIDE: ${{ inputs.region_override }}
          MIN_INSTANCES: ${{ inputs.min_instances }}
          MAX_INSTANCES: ${{ inputs.max_instances }}
          GCP_USER: ${{ inputs.gcp_user }}
          GCP_PASS: ${{ inputs.gcp_pass }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          VPS_API_TOKEN: ${{ secrets.VPS_API_TOKEN }}
