name: Secure SaaS Cloud Automation Worker

on:
  repository_dispatch:
    types: [deploy_trigger] # يتم استدعاؤه تلقائياً من الـ VPS

jobs:
  execute-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Install Base Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright python-dotenv beautifulsoup4

    - name: Install Secure Browser (Chromium)
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Download Secure Script Directly From VPS
      env:
        VPS_URL: ${{ secrets.VPS_URL }}
        SCRIPT_KEY: ${{ secrets.SCRIPT_SECRET_KEY }}
      run: |
        # سحب سكربت التشغيل مشفراً من السيرفر مباشرة إلى ذاكرة جيت هاب المؤقتة
        curl -H "X-Script-Key: $SCRIPT_KEY" "$VPS_URL/api/download-script" -o runner.py

    - name: Launch Cloud Automation Engine
      env:
        # تمرير جميع المدخلات القادمة ديناميكياً من الـ API إلى السكربت التنفيذي
        INPUT_COOKIES_B64: ${{ github.event.client_payload.cookies_b64 }}
        INPUT_LAB_URL: ${{ github.event.client_payload.lab_url }}
        INPUT_CHAT_ID: ${{ github.event.client_payload.chat_id }}
        INPUT_BOT_TOKEN: ${{ github.event.client_payload.bot_token }}
        INPUT_ADMIN_ID: ${{ github.event.client_payload.admin_id }}
        INPUT_LOG_CHANNEL: ${{ github.event.client_payload.log_channel_id }}
        INPUT_MODE: ${{ github.event.client_payload.mode }}
        INPUT_MIN_INSTANCES: ${{ github.event.client_payload.min_instances }}
        INPUT_MAX_INSTANCES: ${{ github.event.client_payload.max_instances }}
      run: |
        # تشغيل السكربت المخفي فوراً
        python runner.py
