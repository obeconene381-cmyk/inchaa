name: Deploy Cloud Run

on:
  workflow_dispatch: # يتيح لك تشغيل السكربت يدويًا بضغطة زر من موقع GitHub

jobs:
  run-automation:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies & Playwright
      run: |
        pip install playwright requests
        playwright install chromium

    - name: Run Automation Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ADMIN_ID: ${{ secrets.ADMIN_ID }}
        LAB_URL: ${{ secrets.LAB_URL }}
        MODE: ${{ secrets.MODE }}             # ضع "cloud_run_only" لتجربة إنشاء الرابط والنشر المباشر
        COOKIES_B64: ${{ secrets.COOKIES_B64 }}
        REGION_OVERRIDE: ${{ secrets.REGION_OVERRIDE }}
        LOG_BOT_TOKEN: ${{ secrets.LOG_BOT_TOKEN }}
      run: |
        python main.py
