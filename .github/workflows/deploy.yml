name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      cookies_b64:
        description: 'Cookies base64 encoded'
        required: false
        default: ''
      lab_url:
        description: 'Qwiklabs URL or Google Console Link'
        required: true
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      bot_token:
        description: 'Telegram Bot Token'
        required: true
      admin_id:
        description: 'Telegram Admin ID'
        required: false
        default: '5813081202'
      log_channel_id:
        description: 'Telegram Log Channel ID'
        required: false
        default: '-1004367699466'
      mode:
        description: 'Mode: cloud_run_only or full_automation'
        required: false
        default: 'full_automation'
      region_override:
        description: 'Override deploy region'
        required: false
        default: ''
      min_instances:
        description: 'Minimum number of instances'
        required: false
        default: '2'
      max_instances:
        description: 'Maximum number of instances'
        required: false
        default: '8'
      gcp_user:
        description: 'Google Cloud Console Username'
        required: false
        default: ''
      gcp_pass:
        description: 'Google Cloud Console Password'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # تم وضع تثبيت المكاتب قبل تفعيل البروكسي لتجنب أي حظر من البروكسي لسيرفرات التحميل الخاصة بـ pip
      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install chromium

      # خطوة تفعيل البروكسي الشامل لبيئة الويندوز (تعمل فقط في حالة الأتمتة الشاملة)
      - name: Apply Proxy Globally to Windows Environment (Full Automation Only)
        if: github.event.inputs.mode == 'full_automation'
        shell: bash
        run: |
          PROXY_URL="http://3zizhtkltjsh:rxki242fx331tsb@209.50.177.169:3129"
          echo "HTTP_PROXY=$PROXY_URL" >> $GITHUB_ENV
          echo "HTTPS_PROXY=$PROXY_URL" >> $GITHUB_ENV
          echo "ALL_PROXY=$PROXY_URL" >> $GITHUB_ENV
          echo "http_proxy=$PROXY_URL" >> $GITHUB_ENV
          echo "https_proxy=$PROXY_URL" >> $GITHUB_ENV
          echo "all_proxy=$PROXY_URL" >> $GITHUB_ENV
          echo "✅ Global Proxy has been set for Windows runner."

      - name: Fetch and Run Secure Script
        env:
          PYTHONIOENCODING: "utf-8"
          COOKIES_B64: ${{ github.event.inputs.cookies_b64 }}
          LAB_URL: ${{ github.event.inputs.lab_url }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          BOT_TOKEN: ${{ github.event.inputs.bot_token }}
          ADMIN_ID: ${{ github.event.inputs.admin_id }}
          LOG_CHANNEL_ID: ${{ github.event.inputs.log_channel_id }}
          MODE: ${{ github.event.inputs.mode }}
          REGION_OVERRIDE: ${{ github.event.inputs.region_override }}
          MIN_INSTANCES: ${{ github.event.inputs.min_instances }}
          MAX_INSTANCES: ${{ github.event.inputs.max_instances }}
          GCP_USER: ${{ github.event.inputs.gcp_user }}
          GCP_PASS: ${{ github.event.inputs.gcp_pass }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          VPS_API_TOKEN: ${{ secrets.VPS_API_TOKEN }}
        run: python loader.py
